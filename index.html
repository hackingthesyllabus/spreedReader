<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Reader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f4ee;
      --ink:#111;
      --panel: rgba(255,255,255,0.55);
      --panel2: rgba(255,255,255,0.65);
      --line: rgba(0,0,0,0.14);
      --focus:#e53935;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    #app{
      min-height: 100vh;
      display:flex;
      flex-direction: column;
    }

    #stage{
      flex: 1;
      padding: 24px;
      display:flex;
      justify-content: center;
      align-items: flex-start;
    }

    .stageUpper{ padding-top: 64px; }
    .stageTop{ padding-top: 24px; }
    .stageMiddle{
      align-items: center;
      padding-top: 24px;
    }

    #readerBox{
      width: min(1200px, 92vw);
      display: grid;
      gap: 14px;
    }

    #word{
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      user-select: none;
      text-align: center;
      max-width: 92vw;
      margin: 0 auto;
      font-size: 64px;
    }

    .wLeft, .wRight, .wFocus{
      display:inline-block;
      white-space: pre;
    }

    .wFocus{
      color: var(--focus);
    }

    #controls{
      padding: 16px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }

    #controlsInner{
      display:grid;
      grid-template-columns: 1fr 420px;
      gap: 16px;
      align-items: start;
    }

    .panel{
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .panelTitle{
      font-weight: 800;
      margin-bottom: 8px;
    }

    textarea{
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      resize: vertical;
    }

    .row{
      display:grid;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.95;
    }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.95;
      align-items: end;
    }

    select{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.75);
      font: inherit;
    }

    input[type="range"], input[type="color"]{
      font: inherit;
    }

    button{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.75);
      cursor: pointer;
      font: inherit;
    }

    button:hover{
      background: rgba(255,255,255,0.95);
    }

    #play{
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      border: 1px solid rgba(0,0,0,0.22);
    }

    .btnRow{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    #meta{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.8;
    }

    #hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
    }

    body.hideControls #controls{
      display:none;
    }

    #fileBox{
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.35);
    }

    #fileRow{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    #status{
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
      white-space: pre-wrap;
    }

    @media (max-width: 980px){
      #controlsInner{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="stage" class="stageUpper">
      <div id="readerBox">
        <div id="word">Paste text below to begin.</div>
      </div>
    </div>

    <div id="controls">
      <div id="controlsInner">

        <div class="panel">
          <div class="panelTitle">Text input</div>

          <textarea id="textInput" rows="8">Paste text here. Press Play.</textarea>

          <div id="fileBox">
            <div class="panelTitle">Upload</div>

            <div id="fileRow">
              <input id="fileInput" type="file" accept=".txt,.md,.html,.rtf,.pdf,application/pdf">
              <button id="clearFile">Clear</button>
            </div>

            <div class="row">
              <label>
                <input id="ignoreHeaderFooter" type="checkbox" checked>
                Ignore header and footer in PDF
              </label>
            </div>

            <div class="row">
              <div>Header and footer trim percent <strong id="trimLabel">8</strong></div>
              <input id="trimPercent" type="range" min="0" max="20" value="8">
            </div>

            <div id="status">Ready.</div>
          </div>

          <div id="hint">
            Hotkeys. Space toggles play. Left and right steps. Escape stops. H hides controls.
          </div>
        </div>

        <div class="panel">
          <div class="panelTitle">Controls</div>

          <div class="row">
            <div>Speed WPM <strong id="wpmLabel">150</strong></div>
            <input id="wpm" type="range" min="60" max="1200" value="150">
          </div>

          <div class="row">
            <div>Comma pause ms <strong id="commaLabel">150</strong></div>
            <input id="commaPause" type="range" min="0" max="600" value="150">
          </div>

          <div class="row">
            <div>Period pause ms <strong id="periodLabel">400</strong></div>
            <input id="periodPause" type="range" min="0" max="1200" value="400">
          </div>

          <div class="row">
            <label>
              <input id="skipParen" type="checkbox">
              Skip parentheses and brackets content
            </label>
          </div>

          <div class="row">
            <label>
              <input id="focusMode" type="checkbox" checked>
              Focus letter mode
            </label>
          </div>

          <div class="row2">
            <label>
              Focus letter colour
              <input id="focusColor" type="color" value="#e53935">
            </label>
            <label>
              Font
              <select id="font">
                <option value="Montserrat, system-ui, Arial" selected>Montserrat</option>
                <option value="system-ui, Arial">System</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Courier New', monospace">Courier</option>
              </select>
            </label>
          </div>

          <div class="btnRow">
            <button id="play">Play</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
          </div>

          <div class="btnRow">
            <button id="prev">Prev</button>
            <button id="next">Next</button>
            <button id="hideControls">Hide controls</button>
          </div>

          <div id="meta">
            Word <span id="idxLabel">0</span> of <span id="totalLabel">0</span>
          </div>

          <div class="row">
            <div>Reader position</div>
            <select id="readerPos">
              <option value="top">Top</option>
              <option value="upper" selected>Upper</option>
              <option value="middle">Middle</option>
            </select>
          </div>

          <div class="row">
            <div>Font size <strong id="sizeLabel">64</strong></div>
            <input id="size" type="range" min="18" max="120" value="64">
          </div>

          <div class="row2">
            <label>
              Text
              <input id="textColor" type="color" value="#111111">
            </label>
            <label>
              Background
              <input id="bgColor" type="color" value="#f6f4ee">
            </label>
          </div>

          <div class="row">
            <div>Align</div>
            <select id="align">
              <option value="left">Left</option>
              <option value="center" selected>Center</option>
              <option value="right">Right</option>
            </select>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
  <script>
    function clamp(n, min, max) {
      if (n < min) return min;
      if (n > max) return max;
      return n;
    }

    function normalizeSpaces(text) {
      return (text || "").replace(/\s+/g, " ").trim();
    }

    function fixPunctuationSpacing(text) {
      let t = text || "";
      t = t.replace(/\s+([,.;:!?])/g, "$1");
      t = t.replace(/\s+([)\]»”’])/g, "$1");
      t = t.replace(/([([«“‘])\s+/g, "$1");
      return t;
    }

    function removeParenContent(text) {
      let t = text || "";
      t = t.replace(/\([^)]*\)/g, " ");
      t = t.replace(/\[[^\]]*\]/g, " ");
      return t;
    }

    function isPunctOnly(tok) {
      return /^[,.;:!?]+$/.test(tok);
    }

    function mergePunctTokens(tokens) {
      const out = [];
      for (let i = 0; i < tokens.length; i += 1) {
        const tok = tokens[i];
        if (isPunctOnly(tok) && out.length) {
          out[out.length - 1] = out[out.length - 1] + tok;
        } else {
          out.push(tok);
        }
      }
      return out;
    }

    function tokenize(text, skipParen) {
      let t = text || "";
      t = normalizeSpaces(t);
      if (skipParen) t = removeParenContent(t);
      t = normalizeSpaces(t);
      t = fixPunctuationSpacing(t);
      t = normalizeSpaces(t);
      if (!t) return [];
      const raw = t.split(" ").filter(Boolean);
      return mergePunctTokens(raw);
    }

    function endsWithAny(word, chars) {
      if (!word) return false;
      const last = word[word.length - 1];
      return chars.indexOf(last) >= 0;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function computeOrpIndex(coreLen) {
      if (coreLen <= 1) return 0;
      if (coreLen <= 5) return 1;
      if (coreLen <= 9) return 2;
      if (coreLen <= 13) return 3;
      return 4;
    }

    function splitWordForFocus(word) {
      const w = String(word || "");
      if (!w) return { left: "", focus: "", right: "" };

      const m = w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([^A-Za-z0-9]*)$/);
      if (!m) {
        const idx0 = clamp(Math.floor(w.length / 2), 0, Math.max(0, w.length - 1));
        return {
          left: w.slice(0, idx0),
          focus: w.slice(idx0, idx0 + 1),
          right: w.slice(idx0 + 1)
        };
      }

      const lead = m[1] || "";
      const core = m[2] || "";
      const trail = m[3] || "";

      const orp = clamp(computeOrpIndex(core.length), 0, Math.max(0, core.length - 1));

      const left = lead + core.slice(0, orp);
      const focus = core.slice(orp, orp + 1);
      const right = core.slice(orp + 1) + trail;

      return { left, focus, right };
    }

    const textInput = document.getElementById("textInput");
    const fileInput = document.getElementById("fileInput");
    const clearFile = document.getElementById("clearFile");
    const statusEl = document.getElementById("status");

    const ignoreHeaderFooter = document.getElementById("ignoreHeaderFooter");
    const trimPercent = document.getElementById("trimPercent");
    const trimLabel = document.getElementById("trimLabel");

    const wpm = document.getElementById("wpm");
    const wpmLabel = document.getElementById("wpmLabel");

    const commaPause = document.getElementById("commaPause");
    const commaLabel = document.getElementById("commaLabel");

    const periodPause = document.getElementById("periodPause");
    const periodLabel = document.getElementById("periodLabel");

    const skipParen = document.getElementById("skipParen");
    const focusMode = document.getElementById("focusMode");
    const focusColor = document.getElementById("focusColor");

    const playBtn = document.getElementById("play");
    const pauseBtn = document.getElementById("pause");
    const resetBtn = document.getElementById("reset");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const hideControlsBtn = document.getElementById("hideControls");

    const idxLabel = document.getElementById("idxLabel");
    const totalLabel = document.getElementById("totalLabel");

    const readerPos = document.getElementById("readerPos");
    const size = document.getElementById("size");
    const sizeLabel = document.getElementById("sizeLabel");
    const textColor = document.getElementById("textColor");
    const bgColor = document.getElementById("bgColor");
    const font = document.getElementById("font");
    const align = document.getElementById("align");

    const stage = document.getElementById("stage");
    const wordEl = document.getElementById("word");

    let words = [];
    let idx = 0;
    let isPlaying = false;
    let timer = null;

    function setStatus(s) {
      statusEl.textContent = s;
    }

    function baseMs() {
      const v = clamp(Number(wpm.value), 60, 2000);
      return Math.round(60000 / v);
    }

    function extraPauseMs(word) {
      if (!word) return 0;
      if (endsWithAny(word, ",;:")) return Number(commaPause.value) || 0;
      if (endsWithAny(word, ".!?")) return Number(periodPause.value) || 0;
      return 0;
    }

    function updateMeta() {
      totalLabel.textContent = String(words.length);
      idxLabel.textContent = words.length ? String(idx + 1) : "0";
    }

    function renderWord() {
      if (!words.length) {
        wordEl.textContent = "Paste text below to begin.";
        updateMeta();
        return;
      }

      const w = words[idx] || "";
      updateMeta();

      if (!focusMode.checked) {
        wordEl.textContent = w;
        return;
      }

      const parts = splitWordForFocus(w);

      wordEl.innerHTML =
        `<span class="wLeft">${escapeHtml(parts.left)}</span>` +
        `<span class="wFocus">${escapeHtml(parts.focus)}</span>` +
        `<span class="wRight">${escapeHtml(parts.right)}</span>`;
    }

    function stop() {
      isPlaying = false;
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function scheduleNext() {
      if (!isPlaying) return;

      const last = Math.max(0, words.length - 1);
      if (!words.length) {
        stop();
        return;
      }

      const current = words[idx] || "";
      const delay = baseMs() + extraPauseMs(current);

      timer = setTimeout(() => {
        if (!isPlaying) return;

        if (idx >= last) {
          idx = last;
          renderWord();
          stop();
          return;
        }

        idx += 1;
        renderWord();
        scheduleNext();
      }, delay);
    }

    function start() {
      if (!words.length) return;
      stop();
      isPlaying = true;
      scheduleNext();
    }

    function reset() {
      stop();
      idx = 0;
      renderWord();
    }

    function stepPrev() {
      stop();
      idx = clamp(idx - 1, 0, Math.max(0, words.length - 1));
      renderWord();
    }

    function stepNext() {
      stop();
      idx = clamp(idx + 1, 0, Math.max(0, words.length - 1));
      renderWord();
    }

    function rebuildWordsFromInput() {
      words = tokenize(textInput.value, skipParen.checked);
      idx = 0;
      stop();
      renderWord();
    }

    function updateLabels() {
      wpmLabel.textContent = String(wpm.value);
      commaLabel.textContent = String(commaPause.value);
      periodLabel.textContent = String(periodPause.value);
      sizeLabel.textContent = String(size.value);
      trimLabel.textContent = String(trimPercent.value);
    }

    function applyStyles() {
      document.documentElement.style.setProperty("--focus", focusColor.value);

      document.body.style.fontFamily = font.value;
      document.body.style.backgroundColor = bgColor.value;
      document.body.style.color = textColor.value;

      wordEl.style.fontFamily = font.value;
      wordEl.style.fontSize = String(size.value) + "px";
      wordEl.style.textAlign = align.value;
      wordEl.style.color = textColor.value;

      stage.className = "";
      if (readerPos.value === "top") stage.classList.add("stageTop");
      if (readerPos.value === "upper") stage.classList.add("stageUpper");
      if (readerPos.value === "middle") stage.classList.add("stageMiddle");
    }

    async function extractPdfText(arrayBuffer) {
      if (!window.pdfjsLib) {
        throw new Error("PDF library not available.");
      }

      const workerUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;

      const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
      const pdf = await loadingTask.promise;

      const ignore = ignoreHeaderFooter.checked;
      const trim = clamp(Number(trimPercent.value) || 0, 0, 20) / 100;

      let out = "";
      for (let p = 1; p <= pdf.numPages; p += 1) {
        setStatus("Reading PDF page " + p + " of " + pdf.numPages + " ...");

        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 1.0 });
        const textContent = await page.getTextContent();

        const pageHeight = viewport.height;
        const yMin = pageHeight * trim;
        const yMax = pageHeight * (1 - trim);

        const items = textContent.items || [];
        const kept = [];

        for (let i = 0; i < items.length; i += 1) {
          const it = items[i];
          if (!it || !it.str) continue;

          let y = null;
          if (it.transform && it.transform.length >= 6) {
            y = it.transform[5];
          }

          if (ignore && typeof y === "number") {
            if (y < yMin) continue;
            if (y > yMax) continue;
          }

          kept.push({ s: it.str, y: y });
        }

        kept.sort((a, b) => {
          const ay = typeof a.y === "number" ? a.y : 0;
          const by = typeof b.y === "number" ? b.y : 0;
          if (ay === by) return 0;
          return by - ay;
        });

        let lastY = null;
        for (let i = 0; i < kept.length; i += 1) {
          const s = kept[i].s;
          const y = kept[i].y;

          if (typeof y === "number" && typeof lastY === "number") {
            const dy = Math.abs(y - lastY);
            if (dy > 12) out += "\n";
          }

          out += s + " ";
          if (typeof y === "number") lastY = y;
        }

        out += "\n\n";
      }

      out = out.replace(/[ \t]+\n/g, "\n");
      out = out.replace(/\n{3,}/g, "\n\n");
      return out.trim();
    }

    textInput.addEventListener("input", rebuildWordsFromInput);

    wpm.addEventListener("input", () => {
      updateLabels();
      if (isPlaying) start();
    });

    commaPause.addEventListener("input", () => updateLabels());
    periodPause.addEventListener("input", () => updateLabels());

    skipParen.addEventListener("change", rebuildWordsFromInput);

    focusMode.addEventListener("change", () => {
      renderWord();
    });

    focusColor.addEventListener("input", () => {
      applyStyles();
      renderWord();
    });

    playBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", stop);
    resetBtn.addEventListener("click", reset);
    prevBtn.addEventListener("click", stepPrev);
    nextBtn.addEventListener("click", stepNext);

    hideControlsBtn.addEventListener("click", () => {
      const hidden = document.body.classList.toggle("hideControls");
      hideControlsBtn.textContent = hidden ? "Show controls" : "Hide controls";
    });

    clearFile.addEventListener("click", () => {
      fileInput.value = "";
      textInput.value = "";
      setStatus("Cleared.");
      rebuildWordsFromInput();
    });

    trimPercent.addEventListener("input", () => updateLabels());

    fileInput.addEventListener("change", async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;

      stop();

      const name = String(f.name || "");
      const lower = name.toLowerCase();

      try {
        if (lower.endsWith(".pdf") || f.type === "application/pdf") {
          setStatus("Loading PDF. This can take a moment.");
          const buf = await f.arrayBuffer();
          const extracted = await extractPdfText(buf);

          if (!extracted || extracted.length < 20) {
            setStatus("PDF loaded, but little text was extracted. This PDF may be scanned images. OCR can be added later.");
          } else {
            setStatus("PDF text extracted. Ready.");
          }

          textInput.value = extracted || "";
          rebuildWordsFromInput();
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          textInput.value = String(reader.result || "");
          setStatus("File loaded. Ready.");
          rebuildWordsFromInput();
        };
        reader.readAsText(f);
      } catch (err) {
        setStatus("Error reading file: " + (err && err.message ? err.message : String(err)));
      }
    });

    readerPos.addEventListener("change", applyStyles);

    size.addEventListener("input", () => {
      updateLabels();
      applyStyles();
      renderWord();
    });

    textColor.addEventListener("input", () => {
      applyStyles();
      renderWord();
    });

    bgColor.addEventListener("input", () => {
      applyStyles();
      renderWord();
    });

    font.addEventListener("change", () => {
      applyStyles();
      renderWord();
    });

    align.addEventListener("change", () => {
      applyStyles();
      renderWord();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (isPlaying) stop();
        else start();
        return;
      }
      if (e.code === "ArrowLeft") {
        stepPrev();
        return;
      }
      if (e.code === "ArrowRight") {
        stepNext();
        return;
      }
      if (e.code === "Escape") {
        stop();
        return;
      }
      if (e.key === "h" || e.key === "H") {
        const hidden = document.body.classList.toggle("hideControls");
        hideControlsBtn.textContent = hidden ? "Show controls" : "Hide controls";
        return;
      }
    });

    updateLabels();
    applyStyles();
    rebuildWordsFromInput();
  </script>
</body>
</html>
