<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Reader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#2E3047;
      --ink:#f6f4ee;

      --panel:#3C3F58;
      --panel2:#43455C;
      --line: rgba(255,255,255,0.12);

      --focus:#3BBA9C;
      --muted:#707793;

      --btn: rgba(255,255,255,0.10);
      --btnHover: rgba(255,255,255,0.16);
      --btnBorder: rgba(255,255,255,0.20);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    #app{
      min-height: 100vh;
      display:flex;
      flex-direction: column;
    }

    #stage{
      flex: 1;
      padding: 24px;
      display:flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    .stageUpper{ padding-top: 64px; }
    .stageTop{ padding-top: 24px; }
    .stageMiddle{
      align-items: center;
      padding-top: 24px;
    }

    #readerBox{
      width: min(1200px, 92vw);
      display: grid;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    #word{
      font-family: Montserrat, system-ui, Arial, sans-serif;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1;
      user-select: none;
      max-width: 92vw;
      margin: 0 auto;
      font-size: 64px;
      color: var(--ink);
    }

    #wordGrid{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      width: min(1100px, 92vw);
      margin: 0 auto;
    }

    #wLeft{
      justify-self: end;
      text-align: right;
      white-space: pre;
    }

    #wFocus{
      justify-self: center;
      text-align: center;
      white-space: pre;
      color: var(--focus);
      font-weight: inherit;
      letter-spacing: inherit;
      line-height: inherit;
    }

    #wRight{
      justify-self: start;
      text-align: left;
      white-space: pre;
    }

    .bigPlayWrap{
      display:flex;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
    }

    .bigPlay{
      padding: 14px 22px;
      border-radius: 16px;
      border: 1px solid var(--btnBorder);
      background: var(--btn);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.01em;
      min-width: 220px;
      color: var(--ink);
      backdrop-filter: blur(6px);
    }

    .bigPlay:hover{
      background: var(--btnHover);
    }

    #controls{
      padding: 16px;
      background: rgba(0,0,0,0.10);
      border-top: 1px solid var(--line);
    }

    #controlsInner{
      display:grid;
      grid-template-columns: 1fr 420px;
      gap: 16px;
      align-items: start;
    }

    .panel{
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
    }

    .panelTitle{
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--ink);
    }

    textarea{
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    textarea::placeholder{
      color: rgba(246,244,238,0.65);
    }

    .row{
      display:grid;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.98;
      color: rgba(246,244,238,0.90);
    }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.98;
      align-items: end;
      color: rgba(246,244,238,0.90);
    }

    select{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input[type="range"], input[type="color"]{
      font: inherit;
    }

    button{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--btnBorder);
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      font: inherit;
      color: var(--ink);
    }

    button:hover{
      background: rgba(255,255,255,0.10);
    }

    .btnRow{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    #meta{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.85;
      color: rgba(246,244,238,0.85);
    }

    #hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.80;
      color: rgba(246,244,238,0.80);
    }

    body.hideControls #controls{
      display:none;
    }

    #fileBox{
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
    }

    #fileRow{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    #status{
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.90;
      white-space: pre-wrap;
      color: rgba(246,244,238,0.85);
    }

    @media (max-width: 980px){
      #controlsInner{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="stage" class="stageUpper">
      <div id="readerBox">
        <div id="word">
          <div id="wordGrid" aria-live="polite" aria-atomic="true">
            <span id="wLeft"></span>
            <span id="wFocus"></span>
            <span id="wRight"></span>
          </div>
        </div>

        <div class="bigPlayWrap">
          <button class="bigPlay" id="playBigTop">Play</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <div id="controlsInner">

        <div class="panel">
          <div class="panelTitle">Text input</div>

          <textarea id="textInput" rows="8" placeholder="Paste text here. Press Play."></textarea>

          <div id="fileBox">
            <div class="panelTitle">Upload</div>

            <div id="fileRow">
              <input id="fileInput" type="file" accept=".txt,.md,.html,.rtf,.pdf,application/pdf">
              <button id="clearFile">Clear</button>
            </div>

            <div class="row">
              <label>
                <input id="ignoreHeaderFooter" type="checkbox" checked>
                Ignore header and footer in PDF
              </label>
            </div>

            <div class="row">
              <div>Header and footer trim percent <strong id="trimLabel">8</strong></div>
              <input id="trimPercent" type="range" min="0" max="20" value="8">
            </div>

            <div id="status">Ready.</div>
          </div>

          <div id="hint">
            Hotkeys. Space toggles play. Left and right steps. Escape stops and shows controls. H hides controls. Click anywhere shows controls.
          </div>
        </div>

        <div class="panel">
          <div class="panelTitle">Controls</div>

          <div class="row">
            <div>Speed WPM <strong id="wpmLabel">175</strong></div>
            <input id="wpm" type="range" min="60" max="1200" value="175">
          </div>

          <div class="row">
            <div>Comma pause ms <strong id="commaLabel">150</strong></div>
            <input id="commaPause" type="range" min="0" max="600" value="150">
          </div>

          <div class="row">
            <div>Period pause ms <strong id="periodLabel">400</strong></div>
            <input id="periodPause" type="range" min="0" max="1200" value="400">
          </div>

          <div class="row">
            <label>
              <input id="skipCitationParen" type="checkbox" checked>
              Skip parentheses and brackets only when they contain digits
            </label>
          </div>

          <div class="row">
            <label>
              <input id="focusMode" type="checkbox" checked>
              Focus letter mode
            </label>
          </div>

          <div class="row2">
            <label>
              Focus letter colour
              <input id="focusColor" type="color" value="#3BBA9C">
            </label>
            <label>
              Font weight
              <select id="weight">
                <option value="500">Light</option>
                <option value="600" selected>Regular</option>
                <option value="700">Bold</option>
              </select>
            </label>
          </div>

          <div class="btnRow">
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
            <button id="prev">Prev</button>
            <button id="next">Next</button>
            <button id="hideControls">Hide controls</button>
          </div>

          <div id="meta">
            Word <span id="idxLabel">0</span> of <span id="totalLabel">0</span>
          </div>

          <div class="row">
            <div>Reader position</div>
            <select id="readerPos">
              <option value="top">Top</option>
              <option value="upper" selected>Upper</option>
              <option value="middle">Middle</option>
            </select>
          </div>

          <div class="row">
            <div>Font size <strong id="sizeLabel">64</strong></div>
            <input id="size" type="range" min="18" max="120" value="64">
          </div>

          <div class="row2">
            <label>
              Text
              <input id="textColor" type="color" value="#f6f4ee">
            </label>
            <label>
              Background
              <input id="bgColor" type="color" value="#2E3047">
            </label>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
  <script>
    function clamp(n, min, max) {
      if (n < min) return min;
      if (n > max) return max;
      return n;
    }

    function normalizeSpaces(text) {
      return (text || "").replace(/\s+/g, " ").trim();
    }

    function fixPunctuationSpacing(text) {
      let t = text || "";
      t = t.replace(/\s+([,.;:!?])/g, "$1");
      t = t.replace(/\s+([)\]»”’])/g, "$1");
      t = t.replace(/([([«“‘])\s+/g, "$1");
      return t;
    }

    function removeCitationParenContent(text) {
      let t = text || "";
      t = t.replace(/\((?=[^)]*\d)[^)]*\)/g, " ");
      t = t.replace(/\[(?=[^\]]*\d)[^\]]*\]/g, " ");
      return t;
    }

    function isPunctOnly(tok) {
      return /^[,.;:!?]+$/.test(tok);
    }

    function mergePunctTokens(tokens) {
      const out = [];
      for (let i = 0; i < tokens.length; i += 1) {
        const tok = tokens[i];
        if (isPunctOnly(tok) && out.length) {
          out[out.length - 1] = out[out.length - 1] + tok;
        } else {
          out.push(tok);
        }
      }
      return out;
    }

    function normalizeHyphens(s) {
      return String(s || "")
        .replaceAll("\u2010", "-")
        .replaceAll("\u2011", "-")
        .replaceAll("\u2012", "-")
        .replaceAll("\u2013", "-")
        .replaceAll("\u2212", "-");
    }

    function alphaNumLen(s) {
      const m = String(s || "").match(/[A-Za-z0-9]/g);
      return m ? m.length : 0;
    }

    function applyHyphenRule(tokens) {
      const out = [];
      for (let i = 0; i < tokens.length; i += 1) {
        const tok = normalizeHyphens(tokens[i]);

        const prev = out.length ? out[out.length - 1] : "";
        const prevLen = alphaNumLen(prev);

        const m = tok.match(/^(.+?)-(.+?)$/);
        if (!m) {
          out.push(tok);
          continue;
        }

        const left = m[1];
        const right = m[2];

        const leftLen = alphaNumLen(left);
        const rightLen = alphaNumLen(right);

        if (prevLen === 3) {
          out.push(tok);
          continue;
        }

        if (leftLen >= 4 && rightLen >= 4) {
          out.push(left + "-");
          out.push(right);
          continue;
        }

        out.push(tok);
      }
      return out;
    }

    function tokenize(text, skipCitationParen) {
      let t = text || "";
      t = normalizeHyphens(t);
      t = normalizeSpaces(t);

      if (skipCitationParen) t = removeCitationParenContent(t);

      t = normalizeSpaces(t);
      t = fixPunctuationSpacing(t);
      t = normalizeSpaces(t);

      if (!t) return [];

      const raw = t.split(" ").filter(Boolean);
      const merged = mergePunctTokens(raw);
      const hyphenApplied = applyHyphenRule(merged);

      return hyphenApplied;
    }

    function endsWithAny(word, chars) {
      if (!word) return false;
      const last = word[word.length - 1];
      return chars.indexOf(last) >= 0;
    }

    let evenFlip = false;

    function splitWordFixedCenter(word) {
      const w0 = String(word || "");
      const w = w0.replace(/\s+/g, "");
      if (!w) return { left: "", focus: "", right: "" };

      const len = w.length;

      let focusIndex = 0;
      if (len === 1) {
        focusIndex = 0;
      } else if (len % 2 === 1) {
        focusIndex = Math.floor(len / 2);
      } else {
        evenFlip = !evenFlip;
        focusIndex = evenFlip ? (len / 2) : (len / 2 - 1);
      }

      return {
        left: w.slice(0, focusIndex),
        focus: w.slice(focusIndex, focusIndex + 1),
        right: w.slice(focusIndex + 1)
      };
    }

    const textInput = document.getElementById("textInput");
    const fileInput = document.getElementById("fileInput");
    const clearFile = document.getElementById("clearFile");
    const statusEl = document.getElementById("status");

    const ignoreHeaderFooter = document.getElementById("ignoreHeaderFooter");
    const trimPercent = document.getElementById("trimPercent");
    const trimLabel = document.getElementById("trimLabel");

    const wpm = document.getElementById("wpm");
    const wpmLabel = document.getElementById("wpmLabel");

    const commaPause = document.getElementById("commaPause");
    const commaLabel = document.getElementById("commaLabel");

    const periodPause = document.getElementById("periodPause");
    const periodLabel = document.getElementById("periodLabel");

    const skipCitationParen = document.getElementById("skipCitationParen");
    const focusMode = document.getElementById("focusMode");
    const focusColor = document.getElementById("focusColor");
    const weight = document.getElementById("weight");

    const pauseBtn = document.getElementById("pause");
    const resetBtn = document.getElementById("reset");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const hideControlsBtn = document.getElementById("hideControls");

    const playBigTop = document.getElementById("playBigTop");

    const idxLabel = document.getElementById("idxLabel");
    const totalLabel = document.getElementById("totalLabel");

    const readerPos = document.getElementById("readerPos");
    const size = document.getElementById("size");
    const sizeLabel = document.getElementById("sizeLabel");
    const textColor = document.getElementById("textColor");
    const bgColor = document.getElementById("bgColor");

    const stage = document.getElementById("stage");
    const wordEl = document.getElementById("word");
    const wLeftEl = document.getElementById("wLeft");
    const wFocusEl = document.getElementById("wFocus");
    const wRightEl = document.getElementById("wRight");

    let words = [];
    let idx = 0;
    let isPlaying = false;
    let timer = null;

    function setStatus(s) {
      statusEl.textContent = s;
    }

    function baseMs() {
      const v = clamp(Number(wpm.value), 60, 2000);
      return Math.round(60000 / v);
    }

    function extraPauseMs(word) {
      if (!word) return 0;
      if (endsWithAny(word, ",;:")) return Number(commaPause.value) || 0;
      if (endsWithAny(word, ".!?")) return Number(periodPause.value) || 0;
      return 0;
    }

    function updateMeta() {
      totalLabel.textContent = String(words.length);
      idxLabel.textContent = words.length ? String(idx + 1) : "0";
    }

    function setPlayLabels() {
      playBigTop.textContent = isPlaying ? "Pause" : "Play";
    }

    function clearDisplay() {
      wLeftEl.textContent = "";
      wFocusEl.textContent = "";
      wRightEl.textContent = "";
      updateMeta();
      setPlayLabels();
    }

    function renderWord() {
      if (!words.length) {
        clearDisplay();
        return;
      }

      const w = words[idx] || "";
      updateMeta();

      if (!focusMode.checked) {
        wLeftEl.textContent = "";
        wFocusEl.style.color = textColor.value;
        wFocusEl.textContent = w;
        wRightEl.textContent = "";
        setPlayLabels();
        return;
      }

      wFocusEl.style.color = getComputedStyle(document.documentElement).getPropertyValue("--focus").trim() || focusColor.value;

      const parts = splitWordFixedCenter(w);
      wLeftEl.textContent = parts.left;
      wFocusEl.textContent = parts.focus;
      wRightEl.textContent = parts.right;

      setPlayLabels();
    }

    function stop() {
      isPlaying = false;
      if (timer) clearTimeout(timer);
      timer = null;
      setPlayLabels();
    }

    function scheduleNext() {
      if (!isPlaying) return;

      const last = Math.max(0, words.length - 1);
      if (!words.length) {
        stop();
        return;
      }

      const current = words[idx] || "";
      const delay = baseMs() + extraPauseMs(current);

      timer = setTimeout(() => {
        if (!isPlaying) return;

        if (idx >= last) {
          idx = last;
          renderWord();
          stop();
          return;
        }

        idx += 1;
        renderWord();
        scheduleNext();
      }, delay);
    }

    function start() {
      if (!words.length) return;
      stop();
      isPlaying = true;
      setPlayLabels();
      scheduleNext();
    }

    function togglePlay() {
      if (isPlaying) stop();
      else start();
    }

    function reset() {
      stop();
      idx = 0;
      renderWord();
    }

    function stepPrev() {
      stop();
      idx = clamp(idx - 1, 0, Math.max(0, words.length - 1));
      renderWord();
    }

    function stepNext() {
      stop();
      idx = clamp(idx + 1, 0, Math.max(0, words.length - 1));
      renderWord();
    }

    function rebuildWordsFromInput() {
      words = tokenize(textInput.value, skipCitationParen.checked);
      idx = 0;
      stop();
      renderWord();
    }

    function updateLabels() {
      wpmLabel.textContent = String(wpm.value);
      commaLabel.textContent = String(commaPause.value);
      periodLabel.textContent = String(periodPause.value);
      sizeLabel.textContent = String(size.value);
      trimLabel.textContent = String(trimPercent.value);
    }

    function applyStyles() {
      document.documentElement.style.setProperty("--focus", focusColor.value);

      wordEl.style.fontWeight = String(weight.value || "600");
      wordEl.style.fontSize = String(size.value) + "px";
      wordEl.style.color = textColor.value;

      document.body.style.backgroundColor = bgColor.value;
      document.body.style.color = textColor.value;

      stage.className = "";
      if (readerPos.value === "top") stage.classList.add("stageTop");
      if (readerPos.value === "upper") stage.classList.add("stageUpper");
      if (readerPos.value === "middle") stage.classList.add("stageMiddle");
    }

    async function extractPdfText(arrayBuffer) {
      if (!window.pdfjsLib) throw new Error("PDF library not available.");

      const workerUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;

      const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
      const pdf = await loadingTask.promise;

      const ignore = ignoreHeaderFooter.checked;
      const trim = clamp(Number(trimPercent.value) || 0, 0, 20) / 100;

      let out = "";
      for (let p = 1; p <= pdf.numPages; p += 1) {
        setStatus("Reading PDF page " + p + " of " + pdf.numPages + " ...");

        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 1.0 });
        const textContent = await page.getTextContent();

        const pageHeight = viewport.height;
        const yMin = pageHeight * trim;
        const yMax = pageHeight * (1 - trim);

        const items = textContent.items || [];
        const kept = [];

        for (let i = 0; i < items.length; i += 1) {
          const it = items[i];
          if (!it || !it.str) continue;

          let y = null;
          if (it.transform && it.transform.length >= 6) y = it.transform[5];

          if (ignore && typeof y === "number") {
            if (y < yMin) continue;
            if (y > yMax) continue;
          }

          kept.push({ s: it.str, y: y });
        }

        kept.sort((a, b) => {
          const ay = typeof a.y === "number" ? a.y : 0;
          const by = typeof b.y === "number" ? b.y : 0;
          return by - ay;
        });

        let lastY = null;
        for (let i = 0; i < kept.length; i += 1) {
          const s = kept[i].s;
          const y = kept[i].y;

          if (typeof y === "number" && typeof lastY === "number") {
            const dy = Math.abs(y - lastY);
            if (dy > 12) out += "\n";
          }

          out += s + " ";
          if (typeof y === "number") lastY = y;
        }

        out += "\n\n";
      }

      out = out.replace(/[ \t]+\n/g, "\n");
      out = out.replace(/\n{3,}/g, "\n\n");
      return out.trim();
    }

    function showControls() {
      if (document.body.classList.contains("hideControls")) {
        document.body.classList.remove("hideControls");
        hideControlsBtn.textContent = "Hide controls";
      }
    }

    textInput.addEventListener("input", rebuildWordsFromInput);

    wpm.addEventListener("input", () => {
      updateLabels();
      if (isPlaying) start();
    });

    commaPause.addEventListener("input", updateLabels);
    periodPause.addEventListener("input", updateLabels);

    skipCitationParen.addEventListener("change", rebuildWordsFromInput);
    focusMode.addEventListener("change", renderWord);

    focusColor.addEventListener("input", () => {
      applyStyles();
      renderWord();
    });

    weight.addEventListener("change", () => {
      applyStyles();
      renderWord();
    });

    playBigTop.addEventListener("click", () => {
      showControls();
      togglePlay();
    });

    pauseBtn.addEventListener("click", () => {
      showControls();
      stop();
    });

    resetBtn.addEventListener("click", () => {
      showControls();
      reset();
    });

    prevBtn.addEventListener("click", () => {
      showControls();
      stepPrev();
    });

    nextBtn.addEventListener("click", () => {
      showControls();
      stepNext();
    });

    hideControlsBtn.addEventListener("click", () => {
      const hidden = document.body.classList.toggle("hideControls");
      hideControlsBtn.textContent = hidden ? "Show controls" : "Hide controls";
    });

    clearFile.addEventListener("click", () => {
      fileInput.value = "";
      textInput.value = "";
      setStatus("Cleared.");
      rebuildWordsFromInput();
    });

    trimPercent.addEventListener("input", updateLabels);

    fileInput.addEventListener("change", async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;

      stop();

      const name = String(f.name || "");
      const lower = name.toLowerCase();

      try {
        if (lower.endsWith(".pdf") || f.type === "application/pdf") {
          setStatus("Loading PDF. This can take a moment.");
          const buf = await f.arrayBuffer();
          const extracted = await extractPdfText(buf);

          if (!extracted || extracted.length < 20) {
            setStatus("PDF loaded, but little text was extracted. This PDF may be scanned images.");
          } else {
            setStatus("PDF text extracted. Ready.");
          }

          textInput.value = extracted || "";
          rebuildWordsFromInput();
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          textInput.value = String(reader.result || "");
          setStatus("File loaded. Ready.");
          rebuildWordsFromInput();
        };
        reader.readAsText(f);
      } catch (err) {
        setStatus("Error reading file: " + (err && err.message ? err.message : String(err)));
      }
    });

    readerPos.addEventListener("change", () => {
      applyStyles();
      renderWord();
    });

    size.addEventListener("input", () => {
      updateLabels();
      applyStyles();
      renderWord();
    });

    textColor.addEventListener("input", () => {
      applyStyles();
      renderWord();
    });

    bgColor.addEventListener("input", () => {
      applyStyles();
      renderWord();
    });

    document.addEventListener("click", () => {
      showControls();
    }, { capture: true });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Escape") {
        showControls();
        stop();
        return;
      }

      if (e.code === "Space") {
        e.preventDefault();
        showControls();
        togglePlay();
        return;
      }

      if (e.code === "ArrowLeft") {
        showControls();
        stepPrev();
        return;
      }

      if (e.code === "ArrowRight") {
        showControls();
        stepNext();
        return;
      }

      if (e.key === "h" || e.key === "H") {
        const hidden = document.body.classList.toggle("hideControls");
        hideControlsBtn.textContent = hidden ? "Show controls" : "Hide controls";
        return;
      }
    });

    updateLabels();
    applyStyles();
    rebuildWordsFromInput();
  </script>
</body>
</html>
