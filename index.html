<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Reader</title>

  <style>
    :root{
      --bg:#f6f4ee;
      --ink:#111;
      --panel: rgba(255,255,255,0.55);
      --panel2: rgba(255,255,255,0.65);
      --line: rgba(0,0,0,0.14);
      --muted: rgba(0,0,0,0.72);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    #app{
      min-height: 100vh;
      display:flex;
      flex-direction: column;
    }

    #stage{
      flex: 1;
      padding: 24px;
      display:flex;
      justify-content: center;
      align-items: flex-start;
    }

    #stage.upper{ padding-top: 64px; }
    #stage.top{ padding-top: 24px; }
    #stage.middle{
      align-items: center;
      padding-top: 24px;
    }

    #readerBox{
      width: min(1200px, 92vw);
      display: grid;
      gap: 14px;
    }

    #word{
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      user-select: none;
      text-align: center;
      max-width: 92vw;
      margin: 0 auto;
      font-size: 64px;
    }

    #controls{
      padding: 16px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }

    #controlsInner{
      display:grid;
      grid-template-columns: 1fr 420px;
      gap: 16px;
      align-items: start;
    }

    .panel{
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .panelTitle{
      font-weight: 800;
      margin-bottom: 8px;
    }

    textarea{
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      resize: vertical;
    }

    #fileRow{
      display:flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    #hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
    }

    .row{
      display:grid;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.95;
    }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.95;
      align-items: end;
    }

    select{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.75);
      font: inherit;
    }

    input[type="range"], input[type="color"]{
      font: inherit;
    }

    button{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.75);
      cursor: pointer;
      font: inherit;
    }

    button:hover{
      background: rgba(255,255,255,0.95);
    }

    .btnRow{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    #play{
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      border: 1px solid rgba(0,0,0,0.22);
    }

    #meta{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.8;
    }

    body.hideControls #controls{
      display:none;
    }
    body.hideControls #stage{
      padding: 24px;
    }
    body.hideControls #stage.upper{
      padding-top: 72px;
    }
    body.hideControls #readerBox{
      width: min(1400px, 94vw);
    }

    body.contrast-dark{
      --bg:#000000;
      --ink:#ffffff;
      --panel: rgba(255,255,255,0.10);
      --panel2: rgba(255,255,255,0.08);
      --line: rgba(255,255,255,0.22);
      --muted: rgba(255,255,255,0.75);
    }

    body.contrast-cream{
      --bg:#0b0b0b;
      --ink:#fff8d6;
      --panel: rgba(255,248,214,0.08);
      --panel2: rgba(255,248,214,0.06);
      --line: rgba(255,248,214,0.22);
      --muted: rgba(255,248,214,0.72);
    }

    body.contrast-blue{
      --bg:#001018;
      --ink:#e9f7ff;
      --panel: rgba(233,247,255,0.10);
      --panel2: rgba(233,247,255,0.08);
      --line: rgba(233,247,255,0.22);
      --muted: rgba(233,247,255,0.75);
    }

    @media (max-width: 980px){
      #controlsInner{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="stage" class="upper">
      <div id="readerBox">
        <div id="word">Paste text below to begin.</div>
      </div>
    </div>

    <div id="controls">
      <div id="controlsInner">

        <div class="panel">
          <div class="panelTitle">Text input</div>
          <textarea id="textInput" rows="8">Paste text here. Press Play.</textarea>

          <div id="fileRow">
            <input id="fileInput" type="file" accept=".txt,.md,.html,.rtf">
            <button id="clearFile">Clear</button>
          </div>

          <div id="hint">
            Hotkeys. Space toggles play. Left and right step. Escape stops. H hides controls.
          </div>
        </div>

        <div class="panel">
          <div class="panelTitle">Controls</div>

          <div class="row">
            <div>Speed WPM <strong id="wpmLabel">150</strong></div>
            <input id="wpm" type="range" min="60" max="1200" value="150">
          </div>

          <div class="row">
            <div>Comma pause ms <strong id="commaLabel">150</strong></div>
            <input id="commaPause" type="range" min="0" max="600" value="150">
          </div>

          <div class="row">
            <div>Period pause ms <strong id="periodLabel">400</strong></div>
            <input id="periodPause" type="range" min="0" max="1200" value="400">
          </div>

          <div class="row">
            <label>
              <input id="skipParen" type="checkbox">
              Skip parentheses and brackets content
            </label>
          </div>

          <div class="btnRow">
            <button id="play">Play</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
          </div>

          <div class="btnRow">
            <button id="prev">Prev</button>
            <button id="next">Next</button>
            <button id="hideControls">Hide controls</button>
          </div>

          <div id="meta">
            Word <span id="idxLabel">0</span> of <span id="totalLabel">0</span>
          </div>

          <div class="row">
            <div>Reader position</div>
            <select id="readerPos">
              <option value="top">Top</option>
              <option value="upper" selected>Upper</option>
              <option value="middle">Middle</option>
            </select>
          </div>

          <div class="row">
            <div>Font size <strong id="sizeLabel">64</strong></div>
            <input id="size" type="range" min="18" max="120" value="64">
          </div>

          <div class="row2">
            <label>
              Text
              <input id="textColor" type="color" value="#111111">
            </label>
            <label>
              Background
              <input id="bgColor" type="color" value="#f6f4ee">
            </label>
          </div>

          <div class="row">
            <div>Font</div>
            <select id="font">
              <option value="system-ui, Arial" selected>System</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="'Courier New', monospace">Courier</option>
            </select>
          </div>

          <div class="row">
            <div>Align</div>
            <select id="align">
              <option value="left">Left</option>
              <option value="center" selected>Center</option>
              <option value="right">Right</option>
            </select>
          </div>

          <div class="row">
            <div>High contrast</div>
            <select id="contrast">
              <option value="none" selected>Off</option>
              <option value="dark">Black and white</option>
              <option value="cream">Cream on black</option>
              <option value="blue">Ice on deep blue</option>
            </select>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    function clamp(n, min, max) {
      if (n < min) return min;
      if (n > max) return max;
      return n;
    }

    function normalizeSpaces(text) {
      return (text || "").replace(/\s+/g, " ").trim();
    }

    function fixPunctuationSpacing(text) {
      let t = text || "";
      t = t.replace(/\s+([,.;:!?])/g, "$1");
      t = t.replace(/\s+([)\]»”’])/g, "$1");
      t = t.replace(/([([«“‘])\s+/g, "$1");
      return t;
    }

    function removeParenContent(text) {
      let t = text || "";
      t = t.replace(/\([^)]*\)/g, " ");
      t = t.replace(/\[[^\]]*\]/g, " ");
      return t;
    }

    function isPunctOnly(tok) {
      return /^[,.;:!?]+$/.test(tok);
    }

    function mergePunctTokens(tokens) {
      const out = [];
      for (let i = 0; i < tokens.length; i += 1) {
        const tok = tokens[i];
        if (isPunctOnly(tok) && out.length) {
          out[out.length - 1] = out[out.length - 1] + tok;
        } else {
          out.push(tok);
        }
      }
      return out;
    }

    function tokenize(text, skipParen) {
      let t = text || "";
      t = normalizeSpaces(t);
      if (skipParen) t = removeParenContent(t);
      t = normalizeSpaces(t);
      t = fixPunctuationSpacing(t);
      t = normalizeSpaces(t);
      if (!t) return [];
      const raw = t.split(" ").filter(Boolean);
      return mergePunctTokens(raw);
    }

    function endsWithAny(word, chars) {
      if (!word) return false;
      const last = word[word.length - 1];
      return chars.indexOf(last) >= 0;
    }

    const textInput = document.getElementById("textInput");
    const fileInput = document.getElementById("fileInput");
    const clearFile = document.getElementById("clearFile");

    const wpm = document.getElementById("wpm");
    const wpmLabel = document.getElementById("wpmLabel");

    const commaPause = document.getElementById("commaPause");
    const commaLabel = document.getElementById("commaLabel");

    const periodPause = document.getElementById("periodPause");
    const periodLabel = document.getElementById("periodLabel");

    const skipParen = document.getElementById("skipParen");

    const playBtn = document.getElementById("play");
    const pauseBtn = document.getElementById("pause");
    const resetBtn = document.getElementById("reset");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const hideControlsBtn = document.getElementById("hideControls");

    const idxLabel = document.getElementById("idxLabel");
    const totalLabel = document.getElementById("totalLabel");

    const readerPos = document.getElementById("readerPos");
    const size = document.getElementById("size");
    const sizeLabel = document.getElementById("sizeLabel");
    const textColor = document.getElementById("textColor");
    const bgColor = document.getElementById("bgColor");
    const font = document.getElementById("font");
    const align = document.getElementById("align");
    const contrast = document.getElementById("contrast");

    const stage = document.getElementById("stage");
    const wordEl = document.getElementById("word");

    let words = [];
    let idx = 0;
    let isPlaying = false;
    let timer = null;

    function baseMs() {
      const v = clamp(Number(wpm.value), 60, 2000);
      return Math.round(60000 / v);
    }

    function extraPauseMs(word) {
      if (!word) return 0;
      if (endsWithAny(word, ",;:")) return Number(commaPause.value) || 0;
      if (endsWithAny(word, ".!?")) return Number(periodPause.value) || 0;
      return 0;
    }

    function updateMeta() {
      totalLabel.textContent = String(words.length);
      idxLabel.textContent = words.length ? String(idx + 1) : "0";
    }

    function renderWord() {
      if (!words.length) wordEl.textContent = "Paste text below to begin.";
      else wordEl.textContent = words[idx] || "";
      updateMeta();
    }

    function stop() {
      isPlaying = false;
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function scheduleNext() {
      if (!isPlaying) return;

      const last = Math.max(0, words.length - 1);
      if (!words.length) {
        stop();
        return;
      }

      const current = words[idx] || "";
      const delay = baseMs() + extraPauseMs(current);

      timer = setTimeout(() => {
        if (!isPlaying) return;

        if (idx >= last) {
          idx = last;
          renderWord();
          stop();
          return;
        }

        idx += 1;
        renderWord();
        scheduleNext();
      }, delay);
    }

    function start() {
      if (!words.length) return;
      stop();
      isPlaying = true;
      scheduleNext();
    }

    function reset() {
      stop();
      idx = 0;
      renderWord();
    }

    function stepPrev() {
      stop();
      idx = clamp(idx - 1, 0, Math.max(0, words.length - 1));
      renderWord();
    }

    function stepNext() {
      stop();
      idx = clamp(idx + 1, 0, Math.max(0, words.length - 1));
      renderWord();
    }

    function rebuildWordsFromInput() {
      words = tokenize(textInput.value, skipParen.checked);
      idx = 0;
      stop();
      renderWord();
    }

    function updateLabels() {
      wpmLabel.textContent = String(wpm.value);
      commaLabel.textContent = String(commaPause.value);
      periodLabel.textContent = String(periodPause.value);
      sizeLabel.textContent = String(size.value);
    }

    function applyTheme() {
      document.body.classList.remove("contrast-dark", "contrast-cream", "contrast-blue");
      if (contrast.value === "dark") document.body.classList.add("contrast-dark");
      if (contrast.value === "cream") document.body.classList.add("contrast-cream");
      if (contrast.value === "blue") document.body.classList.add("contrast-blue");
    }

    function applyStyles() {
      applyTheme();

      document.body.style.fontFamily = font.value;

      if (contrast.value === "none") {
        document.body.style.backgroundColor = bgColor.value;
        document.body.style.color = textColor.value;
      } else {
        document.body.style.backgroundColor = "";
        document.body.style.color = "";
      }

      wordEl.style.fontFamily = font.value;
      wordEl.style.fontSize = String(size.value) + "px";
      wordEl.style.textAlign = align.value;

      if (contrast.value === "none") {
        wordEl.style.color = textColor.value;
      } else {
        wordEl.style.color = "";
      }

      stage.classList.remove("top", "upper", "middle");
      stage.classList.add(readerPos.value);
    }

    textInput.addEventListener("input", rebuildWordsFromInput);

    wpm.addEventListener("input", () => {
      updateLabels();
      if (isPlaying) start();
    });

    commaPause.addEventListener("input", () => updateLabels());
    periodPause.addEventListener("input", () => updateLabels());

    skipParen.addEventListener("change", rebuildWordsFromInput);

    playBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", stop);
    resetBtn.addEventListener("click", reset);
    prevBtn.addEventListener("click", stepPrev);
    nextBtn.addEventListener("click", stepNext);

    hideControlsBtn.addEventListener("click", () => {
      const hidden = document.body.classList.toggle("hideControls");
      hideControlsBtn.textContent = hidden ? "Show controls" : "Hide controls";
    });

    clearFile.addEventListener("click", () => {
      fileInput.value = "";
      textInput.value = "";
      rebuildWordsFromInput();
    });

    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;

      const reader = new FileReader();
      reader.onload = () => {
        textInput.value = String(reader.result || "");
        rebuildWordsFromInput();
      };
      reader.readAsText(f);
    });

    readerPos.addEventListener("change", applyStyles);

    size.addEventListener("input", () => {
      updateLabels();
      applyStyles();
    });

    textColor.addEventListener("input", applyStyles);
    bgColor.addEventListener("input", applyStyles);
    font.addEventListener("change", applyStyles);
    align.addEventListener("change", applyStyles);
    contrast.addEventListener("change", applyStyles);

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (isPlaying) stop();
        else start();
        return;
      }
      if (e.code === "ArrowLeft") {
        stepPrev();
        return;
      }
      if (e.code === "ArrowRight") {
        stepNext();
        return;
      }
      if (e.code === "Escape") {
        stop();
        return;
      }
      if (e.key === "h" || e.key === "H") {
        const hidden = document.body.classList.toggle("hideControls");
        hideControlsBtn.textContent = hidden ? "Show controls" : "Hide controls";
        return;
      }
    });

    updateLabels();
    applyStyles();
    rebuildWordsFromInput();
  </script>
</body>
</html>
